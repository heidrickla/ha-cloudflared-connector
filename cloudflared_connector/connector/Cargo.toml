[package]
name = "connector"
version = "1.2.0"
edition = "2024"
license = "MIT"
description = "Runs cloudflared for the Cloudflared Connector add-on and serves its Home Assistant panel"
publish = false

[dependencies]
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.4.5"
tiny_http = "0.12.0"
ureq = { version = "3.5.0", default-features = false }

# Compiled on the user's machine at install, a Raspberry Pi included, so build time counts more
# than the last few percent of size.
[profile.release]
lto = "thin"
strip = true
