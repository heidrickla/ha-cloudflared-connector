name: Lint and build

on:
  push:
    branches: [main]
  pull_request:

# The forge runs both jobs too; its runner has no ubuntu-26.04 label, and its
# act image has pipx but no shellcheck and no ~/.local/bin on PATH.
jobs:
  lint:
    name: Lint
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-26.04' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: yamllint
        timeout-minutes: 10
        run: |
          pipx run yamllint -d "{extends: relaxed, rules: {line-length: {max: 120}, comments: {min-spaces-from-content: 1}}}" \
            repository.yaml \
            cloudflared_connector/config.yaml \
            cloudflared_connector/build.yaml \
            cloudflared_connector/translations/en.yaml

      - name: shellcheck
        timeout-minutes: 10
        run: pipx run --spec shellcheck-py shellcheck cloudflared_connector/run.sh

      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: cloudflared_connector/Dockerfile
          ignore: DL3018

  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-26.04' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            base: ghcr.io/home-assistant/amd64-base:3.24
            platform: linux/amd64
          - arch: aarch64
            base: ghcr.io/home-assistant/aarch64-base:3.24
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4

      # The matrix names the base the Supervisor builds from; a stale copy tests
      # an image nobody installs.
      - name: Base matches build.yaml
        run: |
          grep -qxF "  ${{ matrix.arch }}: ${{ matrix.base }}" cloudflared_connector/build.yaml

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Builds the add-on image for one architecture. The Dockerfile verifies
      # the cloudflared binary against a recorded SHA-256, so a build that
      # succeeds also proves the pin is intact for that architecture.
      - name: Build
        timeout-minutes: 30
        uses: docker/build-push-action@v6
        with:
          context: ./cloudflared_connector
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_FROM=${{ matrix.base }}
            BUILD_ARCH=${{ matrix.arch }}
          load: true
          tags: cfd:${{ matrix.arch }}
          push: false

      - name: Run cloudflared from the built image
        timeout-minutes: 5
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            --entrypoint /usr/local/bin/cloudflared cfd:${{ matrix.arch }} --version
