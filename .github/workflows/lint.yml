name: Lint and build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: yamllint
        run: |
          pipx install yamllint
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 120}, comments: {min-spaces-from-content: 1}}}" \
            repository.yaml \
            cloudflared_connector/config.yaml \
            cloudflared_connector/build.yaml \
            cloudflared_connector/translations/en.yaml

      - name: shellcheck
        run: shellcheck cloudflared_connector/run.sh

      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: cloudflared_connector/Dockerfile
          ignore: DL3018

  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            base: ghcr.io/home-assistant/amd64-base:3.21
            platform: linux/amd64
          - arch: aarch64
            base: ghcr.io/home-assistant/aarch64-base:3.21
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Builds the add-on image for one architecture. The Dockerfile verifies
      # the cloudflared binary against a recorded SHA-256, so a build that
      # succeeds also proves the pin is intact for that architecture.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ./cloudflared_connector
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_FROM=${{ matrix.base }}
            BUILD_ARCH=${{ matrix.arch }}
          load: true
          tags: cfd:${{ matrix.arch }}
          push: false

      - name: Run cloudflared from the built image
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            --entrypoint /usr/local/bin/cloudflared cfd:${{ matrix.arch }} --version
